*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:600 16px/1.45 var(--f-body);
  padding-block:0;padding-left:var(--gut);padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:560px;margin:0 auto;padding-bottom:170px}
.num{font-variant-numeric:tabular-nums}

/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.top .sal::before{content:'';flex:none;width:43px;height:44px;background:var(--logo-mark) center/contain no-repeat}
.lockup{width:min(100%,260px);aspect-ratio:520/543;margin:6px auto 4px;background:var(--logo-full) center/contain no-repeat}
.top .sal{font:italic 500 19px/1.2 var(--f-display);color:var(--accent);display:flex;align-items:center;gap:12px;min-height:22px}
.top h1{font:700 34px/1.05 var(--f-display);font-variant-numeric:lining-nums;margin:6px 0 0;text-wrap:balance}
.top h1 small{display:block;font:600 12.5px/1.3 var(--f-body);letter-spacing:.01em;color:var(--muted);margin-top:7px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1;min-width:0}
.iconbtn{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--accent);flex:none}
.iconbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.ic{display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.live{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-body);letter-spacing:.01em;color:var(--ok)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.live.off{color:var(--muted)}
.todaybtn{height:42px;padding:0 16px;border-radius:2px;border:1px solid var(--gold);color:var(--gold-ink);font:600 12.5px var(--f-body);letter-spacing:.01em}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:2px;background:var(--surface);border:1px solid var(--line);font:600 12.5px var(--f-body);letter-spacing:.01em;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* franja de resumen */
.strip{display:grid;grid-template-columns:repeat(3,1fr);margin:4px 0 16px}
.strip div{padding:2px 0 2px 16px;border-left:1px solid var(--gold)}
.strip div:first-child{padding-left:0;border-left:0}
.strip b{display:block;font:700 34px/1 var(--f-display);font-variant-numeric:lining-nums}
.strip span{font:600 11.5px var(--f-body);letter-spacing:.01em;color:var(--muted)}

/* citas */
.list{display:flex;flex-direction:column;gap:10px}
.appt{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--cat,var(--gold));border-radius:4px;overflow:hidden}
.appt-main{flex:1;min-width:0;display:flex;gap:14px;padding:14px;align-items:flex-start}
.tm{width:66px;flex:none}
.tm b{font:600 19px/1 var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tm span{font-size:12px;color:var(--muted);margin-left:2px;letter-spacing:.04em}
.bd{min-width:0;flex:1}
.svc{font:700 21px/1.15 var(--f-display);overflow-wrap:anywhere}
.who{margin-top:3px;overflow-wrap:anywhere}
.meta{font-size:13.5px;color:var(--muted);margin-top:2px}
.done{width:58px;flex:none;display:grid;place-items:center;border-left:1px solid var(--line);color:var(--ok);background:var(--ok-soft)}
.pill{flex:none;font:600 10.5px var(--f-body);letter-spacing:.01em;padding:4px 8px;border-radius:2px;white-space:nowrap}
.pill.completed{background:var(--ok-soft);color:var(--ok)}
.pill.cancelled{background:var(--off-soft);color:var(--off)}
.pill.noshow{background:var(--bad-soft);color:var(--bad)}
.pill.confirmed{background:var(--warn-soft);color:var(--warn)}
.appt.cancelled,.appt.noshow{opacity:.62}
.gap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px dashed var(--gold);border-radius:4px;color:var(--muted);font-size:14.5px;text-align:left;width:100%}
.gap b{color:var(--accent);font:600 12px var(--f-body);letter-spacing:.01em}
.empty{text-align:center;padding:40px 12px;color:var(--muted)}
.empty h3{font:700 25px/1.15 var(--f-display);color:var(--ink);margin:0 0 6px}
.empty p{margin:0 auto 16px;max-width:30ch}

/* botones y campos */
.btn{height:50px;padding:0 24px;border-radius:2px;font:600 13px var(--f-body);letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.tonal{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font:600 12px var(--f-body);letter-spacing:.01em;color:var(--muted)}
.in{width:100%;min-height:48px;padding:10px 14px;border-radius:2px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,75,63,.14)}
textarea.in{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:2px;padding:3px;gap:2px;margin:4px 0 16px}
.seg button{height:38px;border-radius:2px;font:600 12.5px var(--f-body);letter-spacing:.01em;text-align:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sub{font:600 12px var(--f-body);letter-spacing:.01em;color:var(--gold-ink);margin:20px 0 8px}

/* filas de listas */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.rows>*+*{border-top:1px solid var(--line)}
.rw{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;min-height:60px}
.rw .t{font-weight:600;overflow-wrap:anywhere}
.rw .s{font-size:13.5px;color:var(--muted)}
.rw .r{margin-left:auto;text-align:right;flex:none;color:var(--muted);font-size:14px}
.rw.off{opacity:.55}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.av{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--gold);color:var(--accent);display:grid;place-items:center;font:600 18px var(--f-display);flex:none}
.tier{font:600 10px var(--f-body);letter-spacing:.01em;padding:2px 7px;border-radius:2px;background:var(--fill);color:var(--muted);margin-left:8px;vertical-align:2px}
.tier.Plata{background:#E9EDF0;color:#46586A}.tier.Oro{background:var(--warn-soft);color:var(--warn)}
.search{position:relative;margin-bottom:12px}
.search .ic{position:absolute;left:14px;top:14px;color:var(--muted)}
.search .in{padding-left:44px}

/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font:600 11.5px var(--f-body);letter-spacing:.1em;color:var(--muted);text-align:center;padding:4px 0}
.cal button{aspect-ratio:1/1.08;border-radius:2px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 17px var(--f-body)}
.cal button small{font:600 11.5px var(--f-body);color:var(--gold-ink);min-height:14px}
.cal button.x{background:transparent;border-color:transparent;color:var(--muted);font-weight:500}
.cal button.dayoff{background:repeating-linear-gradient(135deg,var(--fill) 0 6px,var(--surface) 6px 12px);border-color:var(--gold);color:var(--muted)}
.cal button.dayoff small{color:var(--gold-ink)}
.cal button.today{border:1px solid var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal button.sel small{color:var(--accent-ink)}
.cal i{aspect-ratio:1/1.08}

/* resumen */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:4px;padding:14px}
.tile b{display:block;font:700 42px/1 var(--f-display);font-variant-numeric:lining-nums}
.tile span{display:block;margin-top:6px;font:600 11.5px var(--f-body);letter-spacing:.01em;color:var(--muted)}
.bars>div{margin-bottom:12px}
.bars .l{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:5px}
.bars .l span:last-child{color:var(--muted);flex:none}
.bars .tr{height:6px;background:var(--fill)}
.bars .tr i{display:block;height:100%;background:var(--accent)}
.days{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px}
.days div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.days i{display:block;width:100%;background:var(--accent);min-height:2px}
.days i.z{background:var(--fill)}
.days small{font-size:11px;color:var(--muted);height:13px}
.note{font-size:13.5px;color:var(--muted)}

/* banner de ejemplo */
.demo{display:flex;align-items:center;gap:12px;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.demo button{margin-left:auto;font-weight:600;text-decoration:underline;flex:none;color:inherit}

/* barra inferior y botón flotante */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font:600 10.5px var(--f-body);letter-spacing:.01em;color:var(--muted);min-height:54px}
.tabbar button .pl{width:50px;height:28px;border-radius:2px;display:grid;place-items:center}
.tabbar button[aria-current="page"]{color:var(--accent)}

  let free=false,pick=null;

 openSheet(`${head(esc(s.name),`<span class="pill ${a.status}">${STATUS[a.status]}</span>${a.status==='confirmed'&&a.asked?` <span class="note">Mensaje enviado el ${dmShort(parse(a.asked))}</span>`:''}`)}<div class="sh-body"><dl class="kv"><dt>Cliente</dt><dd>${esc(c.name)}${c.phone?`<br><span class="note">${esc(c.phone)}</span>`:''}</dd><dt>Cuándo</dt><dd>${wdShort(d)} ${dmShort(d)}<br>${t12(a.start)} a ${t12(a.start+a.dur)}</dd>${a.notes?`<dt>Notas</dt><dd>${esc(a.notes)}</dd>`:''}</dl>${acts}</div>`);

 restore:()=>openSheet(`${head('Restaurar copia')}<div class="sh-body"><p class="note" style="margin:0 0 10px">Pega aquí el texto de tu copia. Reemplaza los datos actuales.</p><textarea class="in" id="rs" style="min-height:160px;font-size:13px"></textarea><p class="err" id="ferr" role="alert"></p></div><div class="sh-foot"><button type="button" class="btn" data-act="rsOk">Restaurar</button></div>`),
 rsOk:()=>{try{const d=JSON.parse($('#rs').value);if(!d||!Array.isArray(d.services)||!Array.isArray(d.staff)||!Array.isArray(d.clients)||!Array.isArray(d.appts)||!d.settings)throw 0;db=migrate(d);closeSheet();after('Datos restaurados')}catch(e){ferr('El texto no es una copia válida.')}},
 wipeAsk:()=>openSheet(`${head('¿Borrar todo?')}<div class="sh-body"><p style="margin:0">Se eliminan citas, clientes, ajustes de este teléfono. No se puede deshacer.</p></div><div class="sh-foot"><button type="button" class="btn ghost" data-act="closeSheet">Cancelar</button><button type="button" class="btn danger" data-act="wipeDo">Borrar todo</button></div>`),
 wipeDo:()=>{db=baseDb();closeSheet();after('Datos borrados')}
};
function maintSheet(){
 const l=maintDue();
 const body=l.length?l.map(i=>{const wa=waLink(i.c.phone,fill(db.settings.msg.maint,msgVars(i.c,i.s)));
  const when=i.days>0?`Vencido hace ${i.days} día${i.days===1?'':'s'}`:i.days===0?'Vence hoy':`Vence en ${-i.days} día${i.days===-1?'':'s'}`;
  return `<div class="mc${i.done?' sent':''}"><div class="mc-h"><div style="min-width:0"><div class="mc-n">${esc(i.c.name)}</div><div class="meta">${esc(i.s.name)} · última cita ${dmShort(parse(i.a.date))}</div></div><span class="pill ${i.days>0?'noshow':'confirmed'}">${when}</span></div>
   ${i.notice?`<p class="note" style="margin:8px 0 0">Último aviso: ${dmShort(parse(i.notice))}</p>`:''}
   <div class="mc-a">${wa?`<a class="btn ${i.done?'ghost':''}" href="${wa}" target="_blank" rel="noopener" data-wa="maint" data-k="${esc(i.k)}">${ic('chat',18)}${i.done?'Enviar de nuevo':'Enviar mantenimiento'}</a>`:`<span class="note" style="flex:1;align-self:center">Sin WhatsApp</span>`}
   <button type="button" class="btn tonal" data-act="maintBook" data-c="${i.a.clientId}" data-s="${i.a.serviceId}">Agendar</button></div></div>`}).join('')
  :`<div class="empty"><h3>Todo al día</h3><p>Aquí aparecen los clientes cuando se acerca la fecha de mantenimiento de su servicio.</p></div>`;
 openSheet(`${head('Mantenimiento','Clientes que ya cumplen el plazo de su servicio')}<div class="sh-body">${body}</div><div class="sh-foot"><button type="button" class="btn ghost" data-act="msgEdit">Editar mensaje</button></div>`,true);
}
let imp=null;
function parseVcf(t){const out=[];t=t.replace(/\r/g,'').replace(/\n[ \t]/g,'');
 for(const blk of t.split(/BEGIN:VCARD/i).slice(1)){let name='',tel='';
  for(const ln of blk.split('\n')){const m=ln.match(/^([A-Za-z0-9;=_.\-]+):(.*)$/);if(!m)continue;const key=m[1].split(';')[0].toUpperCase(),val=m[2].trim().replace(/\\,/g,',');
   if(key==='FN'&&val)name=val;else if(key==='N'&&!name)name=val.split(';').filter(Boolean).reverse().join(' ');else if((key==='TEL'||key.endsWith('.TEL'))&&!tel)tel=val}
  if(tel)out.push({name:(name||tel).trim(),phone:tel.replace(/[^\d+]/g,'')})}
 return out}
const isDupPhone=p=>{const d=waDigits(p);return !d||db.clients.some(c=>waDigits(c.phone)===d)};
function impRows(){const q=imp.q.trim().toLowerCase(),qd=q.replace(/\D/g,'');
 const l=imp.list.map((c,i)=>({c,i})).filter(x=>!q||x.c.name.toLowerCase().includes(q)||(qd&&x.c.phone.replace(/\D/g,'').includes(qd))).slice(0,150);
 return l.length?l.map(({c,i})=>{const dup=isDupPhone(c.phone);return `<label class="rw ${dup?'off':''}"><input type="checkbox" class="cb" data-in="impSel" data-i="${i}" ${imp.sel.has(i)?'checked':''} ${dup?'disabled':''}><span style="min-width:0"><span class="t">${esc(c.name)}</span><br><span class="s">${esc(fmtPhone(c.phone)||c.phone)}${dup?' · Ya registrado':''}</span></span></label>`}).join(''):`<p class="note" style="padding:14px;margin:0">Ningún contacto coincide.</p>`}
function updImpFoot(){const b=$('#impgo');if(b){b.textContent='Importar '+imp.sel.size;b.disabled=!imp.sel.size}}
function renderImport(){
 const i=imp,pick=canPick()?`<button type="button" class="btn block" style="margin-bottom:10px" data-act="pick">${ic('contact',20)}Elegir de mis contactos</button>`:'';
 const file=`<label class="btn ${canPick()?'tonal':''} block" for="vcf" style="cursor:pointer">${ic('plus',20)}Subir archivo de contactos (.vcf)</label><input type="file" id="vcf" accept=".vcf,text/vcard,text/x-vcard,text/directory" data-in="vcf" hidden>`;
 const help=i.list.length?'':`<p class="note" style="margin-top:14px">Si tu teléfono no deja elegir contactos desde aquí, exporta tus contactos como archivo .vcf y súbelo. En Android: Contactos › Ajustes › Exportar. En iPhone: iCloud.com › Contactos › Exportar vCard.</p>`;
 const list=i.list.length?`<div class="search" style="margin:16px 0 8px">${ic('search',20)}<input class="in" id="iq" type="search" placeholder="Buscar en ${i.list.length} contactos" value="${esc(i.q)}" data-in="impQ" autocomplete="off"></div>
  <div class="row" style="margin-bottom:10px"><button type="button" class="chip" data-act="impAll">Todos</button><button type="button" class="chip" data-act="impNone">Ninguno</button></div><div class="rows" id="implist">${impRows()}</div>`:'';
 openSheet(`${head('Importar contactos','Se guardan como clientes, con su WhatsApp')}<div class="sh-body">${pick}${file}${i.err?`<p class="err" style="margin-top:10px" role="alert">${esc(i.err)}</p>`:''}${help}${list}</div>${i.list.length?`<div class="sh-foot"><button type="button" class="btn" id="impgo" data-act="impGo" ${i.sel.size?'':'disabled'}>Importar ${i.sel.size}</button></div>`:''}`,true);
}
Object.assign(A,{
 maint:()=>maintSheet(),
 maintBook:d=>{closeSheet();wizStart({step:3,serviceId:d.s,clientId:d.c})},
 msgEdit:()=>{closeSheet();ui.tab='salon';ui.salon='whatsapp';render();scrollTo(0,0)},
 msgReset:()=>{db.settings.msg={...DEFMSG};after('Mensajes restablecidos')},
 okTog:d=>{const a=db.appts.find(x=>x.id===d.id);if(!a)return;a.ok=!a.ok;save();apptSheet(a.id);render()},
 waLog:d=>{if(d.wa==='confirm'){const a=db.appts.find(x=>x.id===d.id);if(a){a.asked=todayStr();save();setTimeout(()=>{if(sheet.open)apptSheet(a.id)},500)}}
  else{db.maint[d.k]=todayStr();save();setTimeout(()=>{if(sheet.open)maintSheet();render()},500)}},
 contacts:()=>{imp={list:[],q:'',sel:new Set(),err:''};renderImport()},
 pick:async()=>{try{const r=await navigator.contacts.select(['name','tel'],{multiple:true});
   imp.list=r.filter(x=>x.tel&&x.tel[0]).map(x=>({name:(x.name&&x.name[0])||x.tel[0],phone:x.tel[0].replace(/[^\d+]/g,'')}));
   imp.sel=new Set(imp.list.map((c,i)=>isDupPhone(c.phone)?-1:i).filter(i=>i>=0));imp.err=imp.list.length?'':'No elegiste contactos con teléfono.';renderImport()}
  catch(e){imp.err='No se pudo abrir tus contactos desde aquí. Sube el archivo .vcf.';renderImport()}},
 impAll:()=>{imp.list.forEach((c,i)=>{if(!isDupPhone(c.phone))imp.sel.add(i)});$('#implist').innerHTML=impRows();updImpFoot()},
 impNone:()=>{imp.sel.clear();$('#implist').innerHTML=impRows();updImpFoot()},
 impGo:()=>{let n=0;imp.sel.forEach(i=>{const c=imp.list[i];if(!c||isDupPhone(c.phone))return;db.clients.push({id:uid(),name:c.name,phone:c.phone,notes:''});n++});
  closeSheet();ui.tab='clientes';after(n?`${n} contacto${n===1?'':'s'} importado${n===1?'':'s'}`:'No había contactos nuevos');scrollTo(0,0)},
 wPickContact:async()=>{try{const r=await navigator.contacts.select(['name','tel'],{multiple:false}),x=r&&r[0];
   if(x){const ph=(x.tel&&x.tel[0]||'').replace(/[^\d+]/g,''),nm=(x.name&&x.name[0])||'',dg=waDigits(ph),ex=dg?db.clients.find(c=>waDigits(c.phone)===dg):null;
    if(ex){wiz.clientId=ex.id}else{wiz.newName=nm;wiz.newPhone=ph;wiz.mode='new'}
    if(ex||(nm&&waOk(ph)))wizStep(2);else renderWiz()}}
  catch(e){const er=$('#werr');if(er)er.textContent='No se pudo abrir tus contactos desde aquí.';else{wiz.mode='new';renderWiz();const e2=$('#werr');if(e2)e2.textContent='No se pudo abrir tus contactos desde aquí. Escribe el nombre y el número.'}}}
});
const I={
 dateIn:el=>{if(el.value){ui.date=el.value;render()}},
 cq:el=>{ui.q=el.value;const l=$('#clist');if(l)l.innerHTML=clientRows()},
 wDate:el=>{if(el.value&&el.value>=todayStr()){wiz.date=el.value;wiz.start=null;renderWiz()}},
 wQ:el=>{wiz.q=el.value;const r=$('#wres');if(r)r.innerHTML=wizResults()},
 wName:el=>{wiz.newName=el.value},wPhone:el=>{wiz.newPhone=el.value},wNotes:el=>{wiz.notes=el.value},
 blk:(el,ev)=>{if(ev.type!=='change')return;const i=+el.dataset.i,j=+el.dataset.j,b=db.settings.blocks.slice();while(b.length<2)b.push(['','']);
  b[i]=b[i].slice();b[i][j]=el.value;db.settings.blocks=b.filter(x=>x[0]||x[1]);save();render()},
 step:(el,ev)=>{if(ev.type==='change'){db.settings.step=+el.value;save()}},
 sname:(el,ev)=>{db.settings.name=el.value.trim()||'Salón Spa Sutil by Clara';save()},
 sphone:el=>{db.settings.phone=el.value;save();const h=$('#wahint');if(h)h.textContent=waHint()},
 scc:el=>{db.settings.cc=el.value.replace(/\D/g,'')||'507';save();const h=$('#wahint');if(h)h.textContent=waHint()},
 mconfirm:el=>{db.settings.msg.confirm=el.value;save()},mmaint:el=>{db.settings.msg.maint=el.value;save()},
 vcf:(el,ev)=>{if(ev.type!=='change')return;const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{imp.list=parseVcf(String(r.result)).sort((a,b)=>a.name.localeCompare(b.name,'es'));imp.sel=new Set();imp.q='';imp.err=imp.list.length?'':'No encontré contactos con teléfono en ese archivo.';renderImport()};
  r.onerror=()=>{imp.err='No se pudo leer el archivo.';renderImport()};r.readAsText(f)},
 impQ:el=>{imp.q=el.value;const l=$('#implist');if(l)l.innerHTML=impRows()},
 impSel:el=>{const i=+el.dataset.i;if(el.checked)imp.sel.add(i);else imp.sel.delete(i);updImpFoot()}
};
document.addEventListener('click',e=>{const w=e.target.closest('[data-wa]');if(w){A.waLog(w.dataset);return}const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t)}});
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const t=e.target.closest&&e.target.closest('[data-in]');if(!t)return;const f=I[t.dataset.in];if(f)f(t,e)}));
